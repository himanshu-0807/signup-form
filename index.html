<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple, minimal signup form with name, email, password, date of birth, role selection and terms agreement.">
  <title>Signup Form</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1>Signup</h1>
    <p class="intro">Create your account to get started. All fields are required.</p>
  </header>

  <main>
    <form id="signup-form" action="#" method="post" novalidate>

      <label class="sr-only" for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" placeholder="Full Name" autocomplete="name" required>

      <label class="sr-only" for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" required>

      <label class="sr-only" for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Password" autocomplete="new-password" minlength="8" required>

      <label class="sr-only" for="confirm">Confirm Password</label>
      <input type="password" id="confirm" name="confirm" placeholder="Confirm Password" autocomplete="new-password" minlength="8" required>

      <label class="sr-only" for="dob">Date of birth (MM/DD/YYYY)</label>
      <input type="text" id="dob" name="dob" placeholder="MM/DD/YYYY" inputmode="numeric" maxlength="10"
             pattern="(0[1-9]|1[0-2])/(0[1-9]|[12][0-9]|3[01])/(19|20)[0-9]{2}" title="Enter your date of birth as MM/DD/YYYY" required>

      <fieldset class="roles">
        <legend class="sr-only">I am a</legend>
        <label class="choice"><input type="radio" name="role" value="student" required> Student</label>
        <label class="choice"><input type="radio" name="role" value="employee" required> Employee</label>
      </fieldset>

      <label class="choice terms">
        <input type="checkbox" id="terms" name="terms" required>
        I agree to all the Terms and conditions
      </label>

      <p id="form-status" role="status" aria-live="polite"></p>

      <button type="submit">Signup</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Signup Form Project &middot; <a href="#">Terms</a> &middot; <a href="#">Privacy</a></p>
  </footer>

  <script>
    var form = document.getElementById('signup-form');
    var pw = document.getElementById('password');
    var confirmPw = document.getElementById('confirm');
    var status = document.getElementById('form-status');

    function checkMatch() {
      confirmPw.setCustomValidity(pw.value !== confirmPw.value ? 'Passwords do not match' : '');
    }
    pw.addEventListener('input', checkMatch);
    confirmPw.addEventListener('input', checkMatch);

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      checkMatch();
      if (!form.checkValidity()) {
        form.reportValidity();
        status.textContent = '';
        return;
      }
      status.textContent = 'Thanks for signing up!';
      form.reset();
    });
  </script>
</body>
</html>
